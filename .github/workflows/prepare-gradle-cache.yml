
name: Prepare Gradle Dependency Cache

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: windows-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Resolve Android Gradle Plugin
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'harmony-gradle-probe'
          New-Item -ItemType Directory -Path $probe -Force | Out-Null

          @'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'harmony-gradle-probe'
          '@ | Set-Content "$probe/settings.gradle" -Encoding utf8

          @'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          '@ | Set-Content "$probe/build.gradle" -Encoding utf8

          Push-Location $probe
          try {
              gradle help --refresh-dependencies --no-daemon
              if ($LASTEXITCODE -ne 0) {
                  throw "Gradle dependency resolution failed."
              }
          }
          finally {
              Pop-Location
          }

      - name: Upload Gradle dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: harmony-gradle-cache-windows
          path: C:\Users\runneradmin\.gradle\caches\modules-2
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
