name: Prepare Gradle Dependency Cache

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: windows-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Create Harmony project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path app -Force | Out-Null

          @'
          pluginManagement {
              repositories {
                  google {
                      content {
                          includeGroupByRegex("com\\.android.*")
                          includeGroupByRegex("com\\.google.*")
                          includeGroupByRegex("androidx.*")
                      }
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Harmony"
          include ':app'
          '@ | Set-Content settings.gradle -Encoding utf8

          @'
          plugins {
              id 'com.android.application' version '8.13.2' apply false
          }
          '@ | Set-Content build.gradle -Encoding utf8

          @'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.harmony'
              compileSdk 35

              defaultConfig {
                  applicationId "com.harmony"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }
          '@ | Set-Content app/build.gradle -Encoding utf8

          @'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          '@ | Set-Content gradle.properties -Encoding utf8

      - name: Resolve Harmony dependencies
        shell: pwsh
        run: |
          gradle help --no-daemon

          if ($LASTEXITCODE -ne 0) {
              throw "Harmony dependency resolution failed."
          }

      - name: Upload Gradle dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: harmony-gradle-cache-windows
          path: D:\a\.gradle\caches
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
